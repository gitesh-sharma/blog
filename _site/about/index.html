  <style>
  :root {
    --primary: #1aa84b;
    --primary-hover: #1db954;
    --primary-dark: #1e40af;
    --bg: #020617;
    --card: #0f172a;
    --border: #1e293b;
    --text: #e5e7eb;
    --muted: #94a3b8;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #020617, #1e293b);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    padding: 20px 10px;
  }

  .wrapper {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
  }

  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px 20px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
  }

  /* Header */
  .blog-header {
    background: rgba(255, 255, 255, 0.04);
    padding: 12px 16px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    flex-wrap: wrap;
    row-gap: 8px;
    position: sticky;
    top: 12px;
    z-index: 999;
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-img {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid var(--primary);
    object-fit: cover;
  }

  .header-left .slash {
    font-size: 18px;
    color: var(--primary);
  }

  .blog-link {
    font-size: 18px;
    font-weight: 600;
    color: var(--primary);
    text-decoration: none;
  }

  .header-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }

  .header-nav a {
    color: #cfd6e4;
    text-decoration: none;
    transition: color 0.2s;
  }

  .header-nav a:hover,
  .blog-link:hover {
    color: var(--primary-hover);
  }

  .header-nav span {
    color: #3a4560;
  }

  /* Search & Filter Bar */
  .search-box {
    margin: 20px 0 10px;
    position: relative;
  }

  .search-input {
    width: 100%;
    padding: 12px 16px 12px 40px;
    border-radius: 12px;
    background: #020617;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input:focus {
    border-color: var(--primary);
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 14px;
  }

  .tag-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }

  .tag-pill {
    padding: 4px 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
  }

  .tag-pill:hover,
  .tag-pill.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* Post List & Cards */
  .recent-posts {
    margin-top: 20px;
  }

  .recent-posts h3 {
    font-size: 18px;
    margin-bottom: 16px;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .daily-badge {
    font-size: 11px;
    background: rgba(26, 168, 75, 0.2);
    color: var(--primary);
    border: 1px solid var(--primary);
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: normal;
  }

  .recent-posts ul {
    list-style: none;
  }

  .recent-card {
    padding: 16px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: rgba(2, 6, 23, 0.6);
    margin-bottom: 14px;
    transition: transform 0.2s, background 0.2s;
  }

  .recent-card:hover {
    transform: translateY(-2px);
    background: rgba(2, 6, 23, 0.9);
    border-color: var(--primary);
  }

  .recent-link {
    text-decoration: none;
    color: inherit;
    display: block;
  }

  .recent-thumb {
    width: 100%;
    max-height: 200px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 12px;
  }

  .recent-title {
    display: block;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    line-height: 1.4;
  }

  .recent-card:hover .recent-title {
    color: var(--primary);
  }

  .recent-meta {
    font-size: 12px;
    color: var(--muted);
    margin: 6px 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .recent-desc {
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
  }

  .post-tags {
    display: flex;
    gap: 4px;
    margin-top: 8px;
  }

  .post-tag {
    font-size: 10px;
    padding: 2px 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    color: var(--muted);
  }

  /* Single Post */
  .post-content {
    margin-top: 20px;
    text-align: left;
  }

  .post-content h1 {
    font-size: 22px;
    line-height: 1.3;
    color: #fff;
    margin-bottom: 10px;
  }

  .post-meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .post-body {
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
  }

  .post-body h2, .post-body h3 {
    color: #fff;
    margin: 20px 0 10px;
  }

  .post-body p {
    margin-bottom: 16px;
  }

  .post-body ul, .post-body ol {
    margin: 0 0 16px 20px;
  }

  .post-body code {
    background: rgba(255, 255, 255, 0.1);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }

  .post-body pre {
    background: #020617;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow-x: auto;
    margin-bottom: 16px;
  }

  .post-body img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 16px auto;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }

  .post-body p > em:only-child {
    display: block;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: -8px;
    margin-bottom: 16px;
  }

  /* Post Share */
  .post-share {
    margin-top: 24px;
    padding-top: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }

  .post-share span {
    color: var(--muted);
  }

  .post-share a,
  .post-share button {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #020617;
    border: 1px solid var(--border);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
  }

  .post-share a:hover,
  .post-share button:hover {
    background: var(--primary);
  }

  .post-divider, .recent-divider {
    border: none;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.2), transparent);
    margin: 24px 0;
  }

  /* Social Icons & Footer */
  .social-icons {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 14px;
  }

  .social-icons a {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #020617;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
    text-decoration: none;
    transition: background 0.2s;
  }

  .social-icons a.instagram:hover { background: #E4405F; }
  .social-icons a.facebook:hover { background: #1877F2; }
  .social-icons a.youtube:hover { background: #FF0000; }
  .social-icons a.whatsapp:hover { background: #25D366; }

  .footer {
    margin-top: 20px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  .footer a {
    color: var(--muted);
    text-decoration: none;
  }

  .footer a:hover {
    color: #fff;
  }

  @media (max-width: 480px) {
    body { padding: 10px 5px; }
    .card { padding: 18px 14px; }
    .recent-title { font-size: 15px; }
  }
  </style>
